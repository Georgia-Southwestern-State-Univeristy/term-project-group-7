name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -S . -B build

      - name: Build (Debug)
        run: cmake --build build --config Debug

      - name: Test (ctest)
        run: ctest --test-dir build -C Debug --output-on-failure